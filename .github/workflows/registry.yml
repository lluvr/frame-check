# Publish server.json to the official MCP registry.
#
# Run by hand after PyPI has the matching release, against the release tag:
#
#   gh workflow run registry.yml -R lluvr/frame-check --ref vX.Y.Z
#
# The registry checks that the PyPI package at server.json's version exists
# and that its README carries `mcp-name: io.github.lluvr/frame-check`.
name: registry

on:
  workflow_dispatch:

permissions:
  id-token: write  # OIDC login for the io.github.lluvr namespace
  contents: read

jobs:
  publish:
    name: Publish to MCP registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install mcp-publisher v1.8.7
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/$archive"
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
